samples:
  - sample_id: "hg002_mini"
    run_mode: "audit_only"
    sample_type: "germline"  # Allowed: germline | somatic_matched | tumor_only | liquid_biopsy
    sequencing_platform: "illumina"  # Allowed: illumina | ultima | element | ont
    library_strategy: "WGS"  # Allowed: WGS | WES
    reported_sex: "XY"  # Allowed: XX | XY
    physician_tumor_purity: 0.00

    read_file_paths:
      read1: "assets/mini_control/hg002_mini_R1.fastq.gz"
      read2: "assets/mini_control/hg002_mini_R2.fastq.gz"

    mapped_paths:
      bam: "assets/hg002_mini.bam"
      bai: "assets/hg002_mini.bam.bai"
      vcf: "assets/hg002_mini.vcf.gz"
      tbi: "assets/hg002_mini.vcf.gz.tbi"

    consent_flags:
      prs_consent: true
      sf_acmg_consent: true
