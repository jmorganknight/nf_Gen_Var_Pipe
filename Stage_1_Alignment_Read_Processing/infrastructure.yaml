# ==============================================================================
# STAGE 1 INFRASTRUCTURE CONTRACT
# Purpose: Host storage roots, governed container identities, and process-level
#          resource envelopes used by the Stage 1 alignment/read-processing gate.
# Regulatory note: these values should stay aligned with Stage 0 governance so
#                  cross-stage audits can confirm container and mount consistency.
# ==============================================================================

storage:
  work_root: "/scratch/nextflow_work"  # Scratch work directory for ephemeral Nextflow task state.
  tmp_root: "/scratch/tmp"  # Shared temporary directory mounted into containers as /tmp.
  reference_host_root: "../assets/references"  # Host reference root resolved from `params.ref_data_root` and mounted read-only to /opt/reference.

containers:
  core:
    image: "wes-onco-core@sha256:d630bd5dd78ba4f469b80d7b0dbd09a5a1bd8841415ed1bbe91d8559a1ff8906"  # Primary runtime image used for alignment, audit, and banking tasks.
    sif: "file://containers/wes-onco-core.sif"  # Apptainer/Singularity image URI for offline or HPC execution.
    digest: "sha256:d630bd5dd78ba4f469b80d7b0dbd09a5a1bd8841415ed1bbe91d8559a1ff8906"  # Local immutable image ID captured for governed runs.
  annotation:
    image: "wes-onco-annotation@sha256:84ebaaaaf5512dc8398dc98a61215a5d419caf1a32bd1ef68369dbcb19d1b69c"  # Downstream annotation image tracked here for governed stack transparency.
    sif: "file://containers/wes-onco-annotation.sif"  # Apptainer/SIF URI for the annotation container.
    digest: "sha256:84ebaaaaf5512dc8398dc98a61215a5d419caf1a32bd1ef68369dbcb19d1b69c"  # Local immutable image ID captured for governed runs.
  multiomics:
    image: "wes-onco-multiomics@sha256:42315555d3fef25d9369af6d8b3bd34f465f94661ca161d49bb70f8d3c394b35"  # Downstream multiomics image tracked for end-to-end governance.
    sif: "file://containers/wes-onco-multiomics.sif"  # Apptainer/SIF URI for the multiomics container.
    digest: "sha256:42315555d3fef25d9369af6d8b3bd34f465f94661ca161d49bb70f8d3c394b35"  # Local immutable image ID captured for governed runs.

process_resources:
  process_low:
    cpus: 2  # CPU cores reserved for lightweight audit, manifest, and indexing tasks.
    memory_gb: 4  # Memory reservation in gibibyte-scale GB units.
    time_hours: 4  # Wall-clock limit in hours.
  process_high:
    cpus: 16  # CPU cores reserved for alignment and identity-gate workloads.
    memory_gb: 256  # Memory reservation in GB; sized for elPrep-intensive runs.
    time_hours: 24  # Wall-clock limit in hours.
