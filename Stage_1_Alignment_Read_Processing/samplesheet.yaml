# ==============================================================================
# STAGE 1 INPUT CONTRACT (BANKED STAGE 0 MANIFEST)
# Purpose: Declares the validated Stage 0 outputs and retained clinical metadata
#          required before short-read alignment and read processing may begin.
# Regulatory note: Stage 1 must reject any record whose Stage 0 intake token is
#                  missing, invalid, or inconsistent with the banked contract.
# ==============================================================================

samples:
  # ---------------------------------------------------------------------------
  # One banked Stage 0 record per specimen. This example points at the HG002
  # Stage 0 fixture outputs and mirrors the fields Stage 0 is expected to emit.
  # ---------------------------------------------------------------------------
  - sample_id: "HG002_FULL_CONTROL_WES"  # Stable sample identifier propagated across all stages.
    patient_id: "HG002"  # Patient or subject identifier from LIMS/EMR; may equal sample_id for controls.
    case_id: "GIAB_CONTROL_CASE"  # Case, family, or accession-group identifier used for multi-sample context.
    accession_id: "ACC-HG002-WES-0001"  # Laboratory accession identifier assigned at order intake.
    encounter_id: "ENC-CONTROL-0001"  # Encounter or visit identifier linked to the order.
    specimen_id: "SPEC-HG002-BLOOD-01"  # Physical specimen identifier used by accessioning or biobank custody.
    analysis_batch_id: "BATCH-STAGE0-DEMO-01"  # Operational batch label grouping samples processed together.
    sample_type: "germline"  # Enum: germline or somatic in the current Stage 1 logic.
    pathologist_tumor_burden: 0.0  # Fraction on a 0-1 scale; preserved for downstream callers and review.
    gender: "male"  # Declared sex/gender carried forward from Stage 0.

    consent:
      prs_opt_in: true  # True allows downstream polygenic risk scoring branches.
      sf_opt_in: true  # True allows ACMG secondary findings analysis and reporting.
      research_opt_in: false  # Optional research-use permission.
      data_sharing_opt_in: false  # Optional permission for controlled external data sharing.
      recontact_opt_in: false  # Optional permission allowing future clinically relevant recontact.
      consent_version: "CLINICAL_WES_V3.2"  # Consent form or policy revision identifier.
      consent_signed_utc: "2026-06-01T13:15:00Z"  # ISO 8601 UTC timestamp of signed consent.
      consent_source: "CLINICAL_INTAKE_FORMS"  # Upstream source system from which consent values were transcribed.

    consent_tokens:
      prs_reporting: "CONSENTED|PRS_ENABLED"  # Derived route token gating downstream PRS analysis.
      secondary_findings: "CONSENTED|SF_ENABLED"  # Derived route token gating ACMG secondary findings analysis.
      research_use: "WITHHELD|RESEARCH_DISABLED"  # Derived route token gating research-only branches.
      data_sharing: "WITHHELD|DATA_SHARING_DISABLED"  # Derived route token gating controlled data-sharing exports.
      recontact: "WITHHELD|RECONTACT_PROHIBITED"  # Derived route token indicating future recontact is not allowed.

    biological_context:
      declared_sex: "male"  # Declared biological sex used for concordance checks.
      reported_ancestry: "benchmark_control"  # Self-reported or operational ancestry label.
      phenotype_terms: "GIAB benchmark control"  # Phenotype or ontology summary relevant to downstream interpretation.
      affected_status: "unaffected"  # Affected/unaffected status used in germline review context.

    diagnosis:
      disease: "reference_control"  # Primary disease or syndrome label; control samples may use an operational label.
      primary_site: "blood"  # Specimen/tissue origin relevant to interpretation context.
      indication: "pipeline_validation"  # Clinical or operational reason for the order.
      icd10: "Z00.00"  # ICD-10 or equivalent coding when available.
      stage: "NA"  # Disease stage; use NA or omit when not clinically relevant.

    specimen:
      specimen_type: "blood"  # Material class: blood, saliva, FFPE, fresh tissue, plasma, and so on.
      tissue_site: "peripheral_blood"  # Anatomic or collection site.
      collection_timestamp_utc: "2026-06-01T12:45:00Z"  # ISO 8601 UTC collection timestamp.
      accessioning_lab: "GIAB_CONTROL_BANK"  # Accessioning or custody lab.
      tumor_purity_estimate: 0.0  # Fraction on a 0-1 scale; relevant primarily for somatic specimens.

    clinical_context:
      mrn: "CONTROL-NOT-APPLICABLE"  # EMR or hospital identifier when available.
      ordering_clinician: "pipeline.validation@lab.internal"  # Ordering provider or responsible reviewer identifier.
      report_priority: "validation"  # Operational priority label such as routine, expedited, STAT, or validation.
      family_history: "none"  # Family-history summary or coded term when available.

    sequencer:
      platform: "illumina"  # Enum: illumina, element, complete_genomics, or ultima.
      model: "NovaSeqX"  # Instrument or chemistry model string.
      flowcell_geometry: "native"  # Geometry enum; Complete Genomics requires DNBSEQ_PATTERNED.

    fastq_forward: "/media/drive_c/nf_pipes/nf_Gen_Var_Pipe/Stage_0_Preflight_Ingest_Gate/tests/fixtures/banked_stage0/validated_fastqs/HG002_FULL_CONTROL_WES_R1.validated.fastq.gz"  # Validated Stage 0 forward-read FASTQ path.
    fastq_reverse: "/media/drive_c/nf_pipes/nf_Gen_Var_Pipe/Stage_0_Preflight_Ingest_Gate/tests/fixtures/banked_stage0/validated_fastqs/HG002_FULL_CONTROL_WES_R2.validated.fastq.gz"  # Validated Stage 0 reverse-read FASTQ path.
    intake_validation_token: "/media/drive_c/nf_pipes/nf_Gen_Var_Pipe/Stage_0_Preflight_Ingest_Gate/tests/fixtures/banked_stage0/intake_token/HG002_FULL_CONTROL_WES.intake_validation_token"  # Mandatory Stage 0 pass token required by Stage 1 preconditions.
    stage0_audit_bundle: "/media/drive_c/nf_pipes/nf_Gen_Var_Pipe/Stage_0_Preflight_Ingest_Gate/tests/fixtures/banked_stage0/audit_bundle/HG002_FULL_CONTROL_WES.stage0.audit_bundle.tar.gz"  # Compressed Stage 0 audit bundle retained for provenance review.
    intake_validation_report: "/media/drive_c/nf_pipes/nf_Gen_Var_Pipe/Stage_0_Preflight_Ingest_Gate/tests/fixtures/banked_stage0/HG002_FULL_CONTROL_WES/audit_and_qc/HG002_FULL_CONTROL_WES.intake_validation_report.json"  # Detailed Stage 0 intake audit JSON.
    intake_route_decision: "/media/drive_c/nf_pipes/nf_Gen_Var_Pipe/Stage_0_Preflight_Ingest_Gate/tests/fixtures/banked_stage0/HG002_FULL_CONTROL_WES/audit_and_qc/HG002_FULL_CONTROL_WES.intake_route_decision.json"  # Deterministic Stage 0 route-decision JSON.
    save_dir: "tests/fixtures/banked_stage1"  # Stage 1 output root; aligned artifacts and audits are banked under this directory.
