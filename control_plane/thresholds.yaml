# ==============================================================================
# CLINICAL PIPELINE THRESHOLDS CONTRACT
# Purpose: Governs numerical cutoffs, platform-specific overrides, consent-aware
#          reporting settings, and discovery/annotation thresholds.
# Units: Fractions are on a 0-1 scale unless otherwise stated. Depth is in reads.
# Regulatory note: Any value change here is analytically meaningful and should be
#                  version-reviewed before production use.
# ==============================================================================

clinical:
  pipeline_target: nf_Gen_Var_Pipe  # Human-readable pipeline release identifier locked into audit artifacts.

  qc_thresholds:
    chromosome_y_depth_floor: 0.15  # Minimum normalized ChrY depth expected for male/XY concordance checks.
    f_inbreeding_male_floor: 0.80  # Minimum X-chromosome inbreeding coefficient expected for male/XY concordance.

  alignment:
    bwa_min_seed_length: 19  # BWA-MEM2 minimum seed length in bases.
    bwa_match_score: 1  # BWA-MEM2 match score.
    bwa_mismatch_penalty: 4  # BWA-MEM2 mismatch penalty.
    read_parity_threshold: 0.99  # Minimum acceptable R1/R2 parity fraction before read-pair imbalance is escalated.
    coverage_uniformity_floor: 0.80  # Minimum acceptable callable-target coverage uniformity fraction.
    gc_bias_max: 0.15  # Maximum tolerated GC bias metric before QC escalation.

  contamination:
    freemix_germline_limit: 0.01  # Maximum VerifyBamID2 freemix fraction allowed for germline samples.

  population:
    maf_inclusion_floor: 0.05  # Minimum cohort allele frequency used when building population/PCA projections.

  masking:
    panel_intron_padding: 20  # Number of intronic bases padded around panel targets for reporting masks.

  purity:
    min_snp_depth_purity: 30  # Minimum per-site depth used by purity estimation routines.
    min_snp_count_purity: 500  # Minimum SNP count required before purity estimates are considered stable.
    cfdna_subclonal_vaf_floor: 0.002  # Minimum variant allele fraction retained for cfDNA subclonal review.
    cfdna_short_fragment_ratio_cutoff: 0.25  # Minimum short-fragment ratio used by cfDNA fragmentomics heuristics.

  discovery:
    manta_min_rescue_score: 20  # Minimum rescue score for structural-variant rescue logic.
    sv_reciprocal_overlap_min: 0.50  # Minimum reciprocal overlap fraction for SV consolidation.
    large_indel_min_size_bp: 50  # Minimum absolute REF/ALT length delta treated as large-indel evidence in the SV lane.
    cnv_mapq_floor: 20  # Minimum mapping quality retained for copy-number modeling.
    cnv_log2_abs_floor: 0.20  # Minimum absolute CNVkit log2 retained as PASS in Stage 3 CNV reporting.
    dnascope_min_mapq: 20  # Minimum mapping quality retained for DNAscope evidence.
    somatic_min_vaf_lod: 0.02  # Minimum VAF retained for somatic evidence accumulation.
    somatic_min_lod_score: 4.0  # Minimum log-odds score retained for somatic evidence.
    somatic_max_maf_sieve: 0.005  # Maximum population frequency allowed before somatic rarity filtering rejects the site.
    snv_fs_threshold: 60.0  # Maximum tolerated Fisher strand-bias score for SNVs.
    snv_sor_threshold: 3.0  # Maximum tolerated symmetric-odds-ratio strand-bias score for SNVs.
    snv_gc_bias_threshold: 0.8  # Platform-dependent GC bias cutoff used where a GC-bias feature exists.
    somatic_qual_floor: 20  # Minimum QUAL retained for somatic structural-variant review.
    germline_qual_floor: 10  # Minimum QUAL retained for germline structural-variant review.
    trisomy_ratio_threshold: 1.35  # Minimum chromosome mapped-read ratio (vs autosome median) for trisomy candidate calling.
    trisomy_z_threshold: 3.0  # Minimum autosome-normalized z-score for trisomy candidate calling.
    enable_reference_backed_norm: true  # True enables left-normalization/reference-backed decomposition.
    atomize_multiallelic: true  # True splits multiallelic sites into atomic records before annotation.

    # Somatic VAF dynamic floor: purity-aware calculation bounds the minimum VAF applied for somatic filtering.
    # Formula: min_vaf = max(somatic_vaf_dynamic.min_bound, min(somatic_vaf_dynamic.max_bound, somatic_vaf_dynamic.base + (1.0 - purity) * somatic_vaf_dynamic.purity_lambda))
    somatic_vaf_dynamic:
      base: 0.01  # Base VAF floor (fallback and lower bound component).
      min_bound: 0.01  # Minimum allowable VAF floor.
      max_bound: 0.08  # Maximum allowable VAF floor.
      purity_lambda: 0.05  # Purity sensitivity coefficient: (1 - purity) * lambda added to base.

    # Somatic AB floor: contamination-aware allele-balance minimum gates per-variant filtering.
    # Formula: ab_floor = max(somatic_ab_dynamic.min_bound, min(somatic_ab_dynamic.max_bound, somatic_ab_dynamic.base + contamination_rate * somatic_ab_dynamic.contam_multiplier))
    somatic_ab_dynamic:
      base: 0.20  # Base allele-balance floor.
      min_bound: 0.10  # Minimum allowable AB floor.
      max_bound: 0.45  # Maximum allowable AB floor.
      contam_multiplier: 2.0  # Contamination rate multiplier: contamination * 2.0 added to base.

  annotation:
    cadd_phred_floor: 20.0  # Minimum CADD PHRED-like score considered supportive for deleteriousness.
    revel_cutoff: 0.75  # Minimum REVEL score considered supportive for pathogenic missense interpretation.
    spliceai_ds_cutoff: 0.20  # Minimum SpliceAI delta score considered supportive for splice impact.
    clinvar_star_floor: 2  # Minimum ClinVar review-star level used for strong evidence filters.
    gnomad_ba1_cutoff: 0.05  # Population frequency cutoff supporting BA1 benign evidence.
    gnomad_bs1_cutoff: 0.01  # Population frequency cutoff supporting BS1 benign evidence.

    # gnomad_popmax_cutoffs: ancestry-specific thresholds used by ACMG secondary findings (SF) and tiering logic.
    gnomad_popmax_cutoffs:
      EUR: 0.002  # European ancestry AF threshold.
      AFR: 0.002  # African ancestry AF threshold.
      AMR: 0.002  # Admixed American ancestry AF threshold.
      EAS: 0.002  # East Asian ancestry AF threshold.
      SAS: 0.002  # South Asian ancestry AF threshold.
      ASJ: 0.002  # Ashkenazi Jewish ancestry AF threshold.
      FIN: 0.002  # Finnish ancestry AF threshold.
      OTH: 0.002  # Other/mixed ancestry AF threshold.
      default: 0.002  # Fallback when ancestry is unknown.

    # acmg_tiering_qual_thresholds: QUAL-dependent tiering gates for ACMG variant classification.
    acmg_tiering_qual_thresholds:
      qual_high: 80  # QUAL >= 80: Tier I classification (strongest).
      qual_medium: 40  # QUAL >= 40: Tier II classification (moderate).
      qual_low: 20  # QUAL >= 20: Tier III classification (minimal).
      af_multiplier_tier2: 2.5  # Tier II AF threshold = popmax_cutoff * 2.5 (relaxed filter).

  germline:
    # ACMG evidence weight map consumed by Stage 5 germline Bayesian scoring.
    acmg_weights:
      PVS1_STRONG: 2.50  # Very strong LoF pathogenic evidence.
      PVS1_MODERATE: 1.50  # Moderate LoF pathogenic evidence.
      PP3: 0.40  # Multi-predictor computational pathogenic support.
      BP4: -0.40  # Multi-predictor computational benign support.
      PM2: 0.70  # Population rarity pathogenic support.
      BS1: -0.90  # Benign population-frequency support.
      BA1: -2.20  # Stand-alone benign population-frequency support.

    # Applied only when benign and pathogenic evidence both coexist and no stronger override fires.
    conflict_dampening_factor: 0.35

  prs:
    # Minimum marker count required before PRS scoring is considered valid.
    no_call_min_markers_required: 2

  pgx:
    # Star-allele definitions used by Stage 5 PGx diplotyping. Add loci here rather than hardcoding in code.
    star_alleles:
      CYP2C19:
        reference_allele: "*1"
        allele_definitions:
          "*2":
            function_class: "no_function"
            loci:
              - variant_id: "rs4244285"
                genome_build: "hg38"
                chrom: "chr10"
                pos: 94781859
                ref: "G"
                alt: "A"
          "*3":
            function_class: "no_function"
            loci:
              - variant_id: "rs4986893"
                genome_build: "hg38"
                chrom: "chr10"
                pos: 94775381
                ref: "G"
                alt: "A"
          "*17":
            function_class: "increased_function"
            loci:
              - variant_id: "rs12248560"
                genome_build: "hg38"
                chrom: "chr10"
                pos: 94761974
                ref: "C"
                alt: "T"

    # Diplotype-to-phenotype translation map used after allele calling.
    phenotype_map:
      CYP2C19:
        "*1/*1": "Normal Metabolizer"
        "*1/*2": "Intermediate Metabolizer"
        "*1/*3": "Intermediate Metabolizer"
        "*2/*2": "Poor Metabolizer"
        "*2/*3": "Poor Metabolizer"
        "*1/*17": "Rapid Metabolizer"
        "*17/*17": "Ultrarapid Metabolizer"
        "*2/*17": "Intermediate Metabolizer"
        default: "Unknown Metabolizer"

    # CPIC actionability and trace text keyed by phenotype.
    cpic_guidelines:
      CYP2C19:
        "Normal Metabolizer":
          cpic_actionability_tier: "A"
          recommendation_trace: "Standard CPIC substrate-specific recommendations apply."
        "Intermediate Metabolizer":
          cpic_actionability_tier: "A"
          recommendation_trace: "Consider alternative therapy or dose adjustment per CPIC substrate-specific guidance."
        "Poor Metabolizer":
          cpic_actionability_tier: "A"
          recommendation_trace: "Avoid affected substrates or choose alternative therapy per CPIC guidance."
        "Rapid Metabolizer":
          cpic_actionability_tier: "A"
          recommendation_trace: "Consider increased dose or alternative therapy per CPIC substrate-specific guidance."
        "Ultrarapid Metabolizer":
          cpic_actionability_tier: "A"
          recommendation_trace: "Consider alternative therapy for affected substrates per CPIC guidance."
        "Unknown Metabolizer":
          cpic_actionability_tier: "C"
          recommendation_trace: "Phenotype unresolved; review required."

  prs:
    no_call_min_markers_required: 2  # Minimum observed marker count before PRS is emitted; below this, fail closed with marker QC no-call.
    prs_min_r2_floor: 0.50  # Minimum imputation or model-fit r^2 retained for PRS marker inclusion.
    prs_gq_floor: 20  # Minimum genotype quality retained for PRS marker inclusion.

  sf:
    minimum_pathogenicity_class: 4  # Only Likely Pathogenic (4) or Pathogenic (5) variants are reportable.
    clinical_protocol_link_base: "urn:acmg-sf-v3.2:"  # Stable protocol-link prefix for ACMG secondary findings reports.
    sf_gq_floor: 30  # Minimum genotype quality retained for ACMG secondary findings review.

  somatic:
    minimum_vaf: 0.05  # Minimum variant allele fraction retained for Stage 5 somatic interpretation.
    reportable_tiers:
      - "I"
      - "II"
      - "III"
      - "IV"
    hotspot_tier_bump: 1  # Number of AMP/ASCO/CAP tiers elevated when a record overlaps a hotspot.

  reporting:
    publish_dir_mode: "copy"  # File publication mode expected for reportable clinical artifacts.
    lis_endpoint_url: "https://fhir.clinical-lab.internal/v1/Observation"  # Internal LIS/FHIR endpoint for report payload exchange.
    lis_max_retries: 3  # Maximum retry count for LIS publication attempts.
    pki_key_path: "keys/clinical_signer.pem"  # Repo-governed signer private-key path used for RS256 clinical payload signatures.
    pki_pub_key_path: "keys/clinical_signer.pub.pem"  # Repo-governed signer public-key path used for audit fingerprinting.
    pki_signer_scope: "bootstrap"  # bootstrap|production signer class; bootstrap is for pre-live validation only.
    pki_signer_id: "local-bootstrap-20260917"  # Human-readable signer identifier recorded into release metadata.
    allow_bootstrap_for_production_run: false  # False prevents a bootstrap key from authorizing production-mode releases.
    consent_token_namespace: "CONSENT_V1"  # Namespace label applied to derived consent-routing tokens.

stage2:
  contamination_fail_closed: true  # True enforces hard failure when contamination exceeds threshold or execution errors occur.
  contamination_non_evaluable_fail_closed: true  # True enforces hard failure when contamination cannot be evaluated (e.g., insufficient marker overlap).
  purity_fail_closed: false  # Current validated policy keeps purity discordance advisory unless explicitly raised.

platform_specific_overrides:
  illumina:
    q30_floor: 0.85  # Minimum Q30 fraction expected for Illumina SBS runs.
    max_optical_duplicate_rate: 0.20  # Maximum optical duplicate fraction tolerated for patterned-flowcell Illumina runs.
    mismatch_rate_floor: 0.005  # Maximum tolerated mismatch burden surrogate for Illumina reads.
    homopolymer_error_sens_cutoff: 0.00  # Disabled for SBS chemistry; retained for schema symmetry.
    spatial_mismapping_filter: false  # Illumina path does not enable DNB-specific spatial mismatch logic.
    dnascope_model_type: "WES"  # Platform-specific DNAscope model label.
    dnascope_enable_flow_model: false  # Flow-space modeling disabled for Illumina SBS data.
    snv_fs_threshold: 60.0  # Illumina-specific SNV FS cutoff.
    snv_sor_threshold: 3.0  # Illumina-specific SNV SOR cutoff.
    snv_gc_bias_threshold: 100.0  # Effectively disabled because the Illumina path does not use a GC-bias field here.

  ultima:
    q30_floor: 0.70  # Minimum Q30 fraction expected for Ultima open-fluidics chemistry.
    max_optical_duplicate_rate: 0.00  # Optical duplicates are not modeled the same way for Ultima bead architecture.
    mismatch_rate_floor: 0.015  # Maximum tolerated mismatch burden surrogate for Ultima reads.
    homopolymer_error_sens_cutoff: 0.98  # Active homopolymer-sensitivity guard for Ultima chemistry.
    spatial_mismapping_filter: false  # No DNB-style spatial mismapping filter is applied.
    dnascope_model_type: "ULTIMA"  # Flow-aware DNAscope model label.
    dnascope_enable_flow_model: true  # Flow-space modeling enabled for Ultima chemistry.
    dnascope_enable_flow_covariates: true  # Flow covariates retained for Ultima evidence modeling.
    snv_fs_threshold: 60.0  # Ultima-specific SNV FS cutoff.
    snv_sor_threshold: 3.0  # Ultima-specific SNV SOR cutoff.
    snv_homopolymer_floor: 5  # Minimum homopolymer-context support threshold for selected indel logic.

  element:
    q30_floor: 0.92  # Minimum Q30 fraction expected for Element avidity chemistry.
    max_optical_duplicate_rate: 0.05  # Maximum optical duplicate fraction tolerated for Element runs.
    mismatch_rate_floor: 0.002  # Maximum tolerated mismatch burden surrogate for Element reads.
    homopolymer_error_sens_cutoff: 0.00  # Disabled because this guard is not expected to drive Element gating.
    spatial_mismapping_filter: false  # DNB-style spatial mismatch logic disabled for Element.
    dnascope_model_type: "WES"  # Element currently reuses the WES model family.
    dnascope_enable_flow_model: false  # Flow-space modeling disabled for Element.
    snv_fs_threshold: 60.0  # Element-specific SNV FS cutoff.
    snv_sor_threshold: 3.0  # Element-specific SNV SOR cutoff.

  complete:
    dnascope_model_type: "WES"  # Complete Genomics currently routes through the WES model family.
    dnascope_enable_strand_bias: true  # Enable strand-bias-aware evidence handling.
    dnascope_enable_patterned_array_bias: true  # Enable patterned-array bias handling for DNB geometry.
    snv_fs_threshold: 60.0  # Complete Genomics SNV FS cutoff.
    snv_sor_threshold: 3.0  # Complete Genomics SNV SOR cutoff.
    snv_gc_bias_threshold: 0.8  # Active GC-bias cutoff used for Complete Genomics-specific evidence fields.
    q30_floor: 0.80  # Minimum Q30 fraction expected for Complete Genomics/DNB-style runs.
    max_optical_duplicate_rate: 0.15  # Maximum tolerated duplicate fraction under patterned DNB geometry.
    mismatch_rate_floor: 0.010  # Maximum tolerated mismatch burden surrogate for Complete Genomics reads.
    homopolymer_error_sens_cutoff: 0.00  # Disabled for this chemistry path.
    spatial_mismapping_filter: true  # Enable DNB coordinate-geometry mismatch filtering.
