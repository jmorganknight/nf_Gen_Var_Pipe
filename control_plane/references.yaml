# Master reference asset map using root-relative entries.
# Resolution precedence is: absolute literal path, then `ref_data_root`, then
# `/opt/reference` fallback inside containerized runs.
# Compatibility aliases are retained under `references` for stage configs that
# parse `references.yaml` as `references.*`.

ref_data_root: "/media/jmk/Extreme Pro/pipeline_references"

# Core Genome Assembly & Index
fasta: "reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"
fai: "reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.fai"
dict: "reference/GRCh38_full_analysis_set_plus_decoy_hla.dict"
