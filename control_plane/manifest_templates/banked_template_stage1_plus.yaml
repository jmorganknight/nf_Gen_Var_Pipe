# ==============================================================================
# MASTER BANKED MANIFEST TEMPLATE v1.0.0 (Stage 1+)
# ==============================================================================
# Purpose: Unified handoff schema for aligned BAM → variant discovery → annotation
# Compliance: Inherits all fields from intake_template.yaml; adds stage-specific fields
# Schema: Cumulative—stages add fields, never remove or rename inherited fields
# Naming Convention: Option A canonical field names
# Reference: Continue using asset_base_uri from intake

manifest_schema_version: "1.0.0"
manifest_template_variant: "banked_stage1_plus"
manifest_description: "Cumulative Stage 1+ handoff manifest (aligned reads → variants)"

samples:
  # ============================================================================
  # INHERITANCE FROM STAGE 0 INTAKE (all fields from intake_template.yaml)
  # ============================================================================
  - sample_id: "SAMPLE_001"
    patient_id: "PATIENT_001"
    case_id: "CASE_001"
    accession_id: ""
    encounter_id: ""
    specimen_id: ""
    analysis_batch_id: ""

    sample_type: "germline"
    pathologist_tumor_burden: 0.0
    physician_tumor_purity: 0.0
    reported_sex: "XY"

    # Sequencing metadata (canonical naming convention)
    sequencing_platform: "illumina"
    sequencer_model: "NovaSeqX"
    flowcell_geometry: "native"
    library_strategy: "WES"
    target_bed: ""

    consent:
      prs_opt_in: true
      sf_opt_in: true
      research_opt_in: false
      data_sharing_opt_in: false
      recontact_opt_in: false
      consent_version: "CONSENT_FORM_v2.1"
      consent_signed_utc: "2026-09-15T08:00:00Z"
      consent_source: "DECLARED_IN_SAMPLESHEET"

    read_file_paths:
      read1: "reads/SAMPLE_001_R1.fastq.gz"
      read2: "reads/SAMPLE_001_R2.fastq.gz"
      read1_sha256: ""
      read2_sha256: ""

    asset_base_uri: "/media/drive_c/nf_pipes"
    save_dir: "results/intake"

    preflight_lock_token: ""
    preflight_lock_path: ""
    intake_validation_report: ""

    # ========================================================================
    # STAGE 1 ADDITIONS: Post-Alignment Handoff
    # ========================================================================
    validation_token: "VALID_PASS|SAMPLE_ALIGNED"                        # REQUIRED enum: validation state
    run_mode: "production"                                                # REQUIRED enum: production|audit_only|dev
    preflight_lock_status: "STAGE0_PREFLIGHT_LOCK_PASS"                 # REQUIRED: Proves intake was sealed

    # Aligned reads (canonical naming: mapped_bam, not sorted_bam)
    mapped_bam: "results/SAMPLE_001/aligned/SAMPLE_001.markdup.bam"      # REQUIRED: Identity-verified aligned BAM
    mapped_bai: "results/SAMPLE_001/aligned/SAMPLE_001.markdup.bam.bai"  # REQUIRED: BAM index
    mapped_bam_sha256: ""                                                  # OPTIONAL: BAM integrity digest

    # Identity and QC audit trails
    identity_audit: "results/SAMPLE_001/audit/identity_audit.json"       # REQUIRED: VerifyBamID2 or equivalent
    identity_concordance: 0.9999                                          # OPTIONAL float [0.0-1.0]: genetic match score
    contamination_rate: 0.001                                             # OPTIONAL float [0.0-1.0]: estimated contamination

    # Audit provenance (Stage 0 outputs retained for lineage)
    intake_validation_token: "audit/SAMPLE_001/intake_validation.token"   # REQUIRED: Stage 0 validation artifact
    stage0_audit_bundle: "audit/SAMPLE_001/stage0_audit_bundle.tar.gz"   # OPTIONAL: Compressed audit provenance

    # Reference snapshot for audit reproducibility and variant normalization
    reference_build:                                                       # REQUIRED section: genomic reference data
      reference_genome: "reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"  # REQUIRED: Reference FASTA
      reference_fai: "reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.fai" # REQUIRED: FASTA index
      reference_dict: "reference/GRCh38_full_analysis_set_plus_decoy_hla.dict"  # REQUIRED: Sequence dictionary
      bwa_index_base: "reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"    # REQUIRED: BWA-MEM2 index prefix

      # Optional reference variants and annotations
      clinvar_db: "reference/clinvar_20260601.vcf.gz"                    # OPTIONAL: ClinVar database
      gnomad_db: "reference/gnomad_v4.0_sites.vcf.gz"                    # OPTIONAL: gnomAD allele frequencies
      onco_target_bed: "reference/OncoPanel_v4.2.bed"                    # OPTIONAL: Assay target regions
      sf_bed: "reference/ACMG_SF_v3.2.bed"                               # OPTIONAL: Secondary findings regions

    # ========================================================================
    # STAGE 2 ADDITIONS: Post-Alignment Validation & Routing
    # ========================================================================
    # (These fields appear if this manifest represents a Stage 2+ sample)

    stage2_router_token: "WES|TARGET_VALIDATED"                          # Stage 2 routing decision enum
    stage2_contamination_status: "PASS"                                   # Stage 2 validation result enum
    stage2_contamination_policy_action: ""                                # Policy action if contamination detected

    # Validation audit trails
    contamination_audit: "results/SAMPLE_001/qc/contamination_audit.json"        # Contamination analysis
    purity_and_sex_validation_audit: "results/SAMPLE_001/qc/purity_sex_audit.json" # Purity/sex concordance
    assay_target_router_audit: "results/SAMPLE_001/qc/router_audit.json"         # Assay routing decision

    # Computed metadata from validation gates
    estimated_in_silico_purity: 0.98                                      # OPTIONAL float [0.0-1.0]
    computed_sex: "XY"                                                    # OPTIONAL: Genetically inferred sex
    sex_concordance_pass: true                                            # OPTIONAL bool: reported_sex == computed_sex
    purity_concordance_pass: true                                         # OPTIONAL bool: purity thresholds met

    # ========================================================================
    # STAGE 3 ADDITIONS: Variant Discovery & Harmonization
    # ========================================================================
    # (These fields appear if this manifest represents a Stage 3+ sample)

    # Variant discovery outputs (canonical naming: normalized_vcf, not phased_vcf here)
    normalized_vcf: "results/SAMPLE_001/variants/SAMPLE_001.normalized.vcf.gz"   # REQUIRED: Harmonized multi-allelic VCF
    normalized_vcf_tbi: "results/SAMPLE_001/variants/SAMPLE_001.normalized.vcf.gz.tbi" # REQUIRED: VCF index
    normalized_vcf_sha256: ""                                             # OPTIONAL: VCF integrity digest
    normalized_vcf_tbi_sha256: ""                                          # OPTIONAL: Index integrity digest

    # Variant harmonization audit
    harmonization_audit: "results/SAMPLE_001/audit/harmonization.json"   # Variant normalization audit
    zero_loss_audit: "results/SAMPLE_001/audit/zero_loss.json"           # Variant counting audit (ensures no rows dropped)

    # Variant discovery metrics
    pre_merge_row_sum: 1000                                               # Total variants before merging
    merged_row_count: 950                                                 # After multi-allelic merge
    normalized_row_count: 950                                             # After normalization
    dropped_rows: 0                                                        # Quality control metric

    # Active branches for downstream stages
    variant_branches:                                                      # Feature enablement (inherited from intake)
      snv_indel: true
      structural_variants: true
      copy_number_cnv: true
      str_expansions: false
      trisomy_aneuploidy: true
      homologous_pseudogenes: false

    active_branches:                                                       # OPTIONAL: Which branches actually produced output
      - "snv_indel"
      - "structural_variants"
      - "copy_number_cnv"
