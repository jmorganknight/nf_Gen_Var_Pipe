# ==============================================================================
# STAGE 0 INFRASTRUCTURE CONTRACT
# Purpose: Host storage roots, governed container identities, and process-level
#          resource envelopes used by the Stage 0 preflight intake gate.
# Regulatory note: container digests, once populated, are locked into the Stage 0
#                  reference snapshot audit to prevent silent runtime drift.
# ==============================================================================

storage:
  work_root: "/scratch/nextflow_work"  # Scratch work directory for ephemeral Nextflow task state.
  tmp_root: "/scratch/tmp"  # Shared temporary directory mounted into containers as /tmp.
  reference_host_root: "/media/jmk/Extreme Pro/WES_Onco_References"  # Host path mounted read-only to /opt/reference for governed reference assets.

containers:
  core:
    image: "wes-onco-core:1.0.0"  # Primary runtime image used for Stage 0 validation and banking tasks.
    sif: "file://containers/wes-onco-core.sif"  # Apptainer/Singularity image URI for offline or HPC execution.
    # digest: "sha256:..."  # Populate before clinical release; REF_MANIFEST_SNAPSHOT_LOCK records this value.
  annotation:
    image: "wes-onco-annotation:latest"  # Downstream annotation image tracked here so snapshot audits capture the whole governed stack.
    sif: "file://containers/wes-onco-annotation.sif"  # Apptainer/SIF URI for the annotation container.
    # digest: "sha256:..."  # Populate with immutable registry digest before production sign-off.
  multiomics:
    image: "wes-onco-multiomics:1.0.0"  # Downstream multiomics image tracked for cross-stage governance.
    sif: "file://containers/wes-onco-multiomics.sif"  # Apptainer/SIF URI for the multiomics container.
    # digest: "sha256:..."  # Populate with immutable registry digest before production sign-off.

process_resources:
  process_low:
    cpus: 2  # CPU cores reserved for lightweight validation and manifest assembly tasks.
    memory_gb: 4  # Memory reservation in gibibyte-scale GB units.
    time_hours: 4  # Wall-clock limit in hours.
  process_medium:
    cpus: 8  # CPU cores reserved for moderate audit or integrity tasks.
    memory_gb: 32  # Memory reservation in GB.
    time_hours: 12  # Wall-clock limit in hours.
  process_high:
    cpus: 16  # CPU cores reserved for the largest governed tasks in this micro-pipeline.
    memory_gb: 128  # Memory reservation in GB.
    time_hours: 24  # Wall-clock limit in hours.