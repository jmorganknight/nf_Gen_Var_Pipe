# ==============================================================================
# CLINICAL PIPELINE REFERENCE ASSETS MANIFEST (GRCh38 / hg38)
# Purpose: Defines immutable paths to the genome assembly, alignment indices,
#          assay targets, interpretation databases, and model assets.
# Regulatory note: Stage 0 snapshots and SHA256-hashes every active path below to
#                  prevent silent reference drift between validation and reporting.
# Path convention: Active paths are container-internal under /opt/reference and
#                  must resolve via the governed read-only reference mount.
# ==============================================================================

references:
  # --- Core genome assembly used by alignment, QC, and downstream normalization ---
  reference_genome: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"  # Canonical FASTA key consumed by pipeline code.
  grch38_fasta: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"  # Human-facing alias for auditors who expect an explicit GRCh38 FASTA label.
  reference_dict: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.dict"  # SAM/BAM sequence dictionary; must match reference_genome exactly.
  grch38_dict: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.dict"  # Human-facing alias for the sequence dictionary.
  reference_fai: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.fai"  # FASTA index used for random-access coordinate lookup.
  grch38_fai: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.fai"  # Human-facing alias for the FASTA index.

  # --- Alignment index contract ---
  bwa_index_base: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"  # BWA-MEM2 basename/prefix; sidecar files (.amb/.ann/.pac/.bwt.2bit.64/.0123) are inferred from this value.
  bwa_index: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"  # Audit-friendly alias retained for external manifests that describe a BWA index path more generically.
  bwa_index_amb: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.amb"
  bwa_index_ann: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.ann"
  bwa_index_pac: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.pac"
  bwa_index_bwt_2bit_64: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.bwt.2bit.64"
  bwa_index_0123: "/opt/reference/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa.0123"
  # elprep_index: "/opt/reference/reference/elprep_index"  # Uncomment only after a governed elPrep-specific index asset is published and mounted.

  # --- Capture regions and reporting masks ---
  onco_target_bed: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.bed"  # Primary BED of callable/reportable assay targets.
  capture_wes_bed: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.bed"  # Audit-friendly alias for the capture BED when third parties expect WES terminology.
  onco_target_intervals: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.interval_list"  # Interval-list form used by tools that require Picard/GATK-style coordinates.
  capture_wes_targets_bed_gz: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.bed.gz"
  capture_wes_targets_bed_gz_tbi: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.bed.gz.tbi"
  onco_virtual_panel_bed: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.virtual_panel.bed"
  virtual_panel_bed: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.virtual_panel.bed"
  elprep_intervals: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.interval_list"
  elprep_snv_matrix: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.interval_list"
  elprep_indel_matrix: "/opt/reference/beds/OncoPanel_v4.2_Master_hs38DH.interval_list"
  sf_bed: "/opt/reference/beds/ACMG_SF_v3.2_hs38DH.bed"  # Secondary findings BED used only when consent allows optional ACMG analysis.
  # onco_virtual_panel_bed: "/opt/reference/beds/onco_virtual_panel.bed"  # Optional in-silico reporting mask; keep commented until the governed asset exists.
  mane_db: "/opt/reference/beds/mane_select_v1.3.bed"  # MANE transcript BED used for clinically preferred transcript selection.
  hotspot_registry: "/opt/reference/beds/somatic_hotspots_v2.1.bed_hs38DH"  # Curated somatic hotspot registry for targeted interpretation.

  # --- Annotation databases and frequency resources ---
  vep_cache_dir: "/opt/reference/vep/.vep"  # VEP cache directory pinned for annotation reproducibility.
  clinvar_db: "/opt/reference/clinvar/clinvar_20260601.vcf.gz"  # Primary ClinVar release used for clinical significance annotation.
  clinvar_3star_db: "/opt/reference/clinvar/clinvar_3star_pathogenic_20260601.vcf.gz"  # High-confidence ClinVar subset used for stringent evidence tiers.
  gnomad_db: "/opt/reference/clinvar/gnomad.v4.0.genomes.vcf.gz"  # Population frequency resource for BA1/BS1 and rarity filters.
  hgmd_db: "/opt/reference/clinvar/hgmd_pro_mock.vcf.gz"  # HGMD-compatible mock resource used in this governed environment.
  hgmd_pro_db: "/opt/reference/clinvar/hgmd_pro_mock.vcf.gz"
  dbsnp_resource: "/opt/reference/clinvar/dbsnp_156_hs38DH.vcf.gz"  # dbSNP build used for rsID normalization and known-site context.
  sentieon_pon: "/opt/reference/clinvar/Sentieon_OncoPanel_v4_PON.vcf.gz"  # Panel-of-normals resource for somatic artifact suppression.
  hotspot_registry: "/opt/reference/beds/somatic_hotspots_v2.1.bed_hs38DH"
  acmg_sf_v3_2_59_genes_bed: "/opt/reference/beds/ACMG_SF_v3.2_hs38DH.bed"
  prs_weights: "/opt/reference/models/pgs_weights_v1.tsv"
  prs_weight_model_dir: "/opt/reference/models"

  # --- Model and scoring assets ---
  models:
    dnascope_germline: "/opt/reference/models/ml_germline_v4.model"  # Germline DNAscope model pinned for deterministic calling.
    prs_weights: "/opt/reference/models/pgs_weights_v1.tsv"  # PRS weight table; used only when PRS consent routing is enabled.
    cadd_scores: "/opt/reference/models/CADD_GRCh38_v1.7.tsv.gz"  # CADD score resource for deleteriousness annotation.
    revel_scores: "/opt/reference/models/revel_GRCh38_v1.7.tsv.gz"  # REVEL score resource for missense interpretation.
    alphamissense_scores: "/opt/reference/models/AlphaMissense_hg38.tsv.gz"
    pangolin_weights: "/opt/reference/models/Pangolin_Weights_v1.0"  # Pangolin splice model weights.
    population_pca_matrix: "/opt/reference/models/background_projection.eigenvec"  # Background PCA matrix used for ancestry/population projection.
    poppca_models: "/opt/reference/PopPCA_models"  # Directory of governed population-PCA models.
  stage3:
    deepvariant_model_dir: "/opt/reference/models/deepvariant"
    cnvkit_pooled_reference: "/opt/reference/models/cnvkit_pooled_reference.cnn"
    expansionhunter_variant_catalog: "/opt/reference/models/variant_catalog_grch38.json"
    cyp2d6_paralog_mask_bed: "/opt/reference/beds/CYP2D6_paralog_mask.bed"
    gba_paralog_mask_bed: "/opt/reference/beds/GBA_paralog_mask.bed"
  stage4:
    poppca_refgen_dir: "/opt/reference/PopPCA_models"
    shapeit4_reference_panel_dir: "/opt/reference/shapeit4_1000g"
  stage5:
    vep_plugin_cadd_tsv_gz: "/opt/reference/models/CADD_GRCh38_v1.7.tsv.gz"
    vep_plugin_revel_csv_gz: "/opt/reference/models/revel_GRCh38_v1.7.tsv.gz"
    vep_plugin_alphamissense_tsv_gz: "/opt/reference/models/AlphaMissense_hg38.tsv.gz"
    vep_plugin_pangolin_dir: "/opt/reference/models/Pangolin_Weights_v1.0"
    gnomad_v4_background_vcf: "/opt/reference/clinvar/gnomad.v4.0.genomes.vcf.gz"
    hgmd_pro_2026_1_db: "/opt/reference/clinvar/hgmd_pro_mock.vcf.gz"
